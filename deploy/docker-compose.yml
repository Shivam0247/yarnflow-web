# YarnFlow in production: database + app + HTTPS. Start with ./setup.sh (see deploy/README.md).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: yarnflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: yarnflow
    command: postgres -c max_wal_size=4GB -c shared_buffers=1GB -c work_mem=64MB -c maintenance_work_mem=1GB -c jit=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yarnflow -d yarnflow"]
      interval: 5s
      retries: 30
    # never published to the internet: only the app talks to it
  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://yarnflow:${DB_PASSWORD}@db:5432/yarnflow
      JWT_SECRET: ${JWT_SECRET}
      YF_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      HOST: 0.0.0.0
      PORT: "4000"
      CORS_ORIGIN: https://${DOMAIN}
    volumes:
      - ${EXPORT_DIR:-./export}:/export:ro
      - ./reports:/reports
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
volumes:
  pgdata:
  caddydata:
