<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YarnFlow · Outstanding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.dark{--bg:#141414;--sb:#1B1B1B;--s1:#1E1E1E;--s2:#262626;--s3:#2E2E2E;--bd:#262626;--bd2:#383838;--t1:#EDEDED;--t2:#B5B5B5;--t3:#8F8F8F;--ib:#F5F5F5;--it:#171717;color-scheme:dark}
.light{--bg:#FFFFFF;--sb:#F8F8F8;--s1:#F7F7F7;--s2:#F1F1F1;--s3:#E9E9E9;--bd:#ECECEC;--bd2:#DDDDDD;--t1:#171717;--t2:#525252;--t3:#6B6B6B;--ib:#171717;--it:#FFFFFF;color-scheme:light}
.app{display:flex;flex-wrap:wrap;min-height:100vh;background:var(--bg);color:var(--t1)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.sbw{flex:1 1 236px;max-width:100%;background:var(--sb);border-right:1px solid var(--bd)}
.main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bc{display:flex;align-items:center;gap:8px;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:0;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--s2);color:var(--t1)}
.btn:hover{background:var(--s3)}
.btn.pr{background:var(--ib);color:var(--it)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.ic{width:34px;padding:0;justify-content:center}
.inp{height:34px;border-radius:8px;border:1px solid transparent;background:var(--s2);padding:0 10px;font-size:14px;color:var(--t1);min-width:0}
.inp::placeholder{color:var(--t3)}
.fbar{display:flex;align-items:center;gap:8px;padding:14px 20px;flex-wrap:wrap}
.fbar .inp{flex:1 1 130px;max-width:180px}
.seg{display:inline-flex;background:var(--s1);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--t3);cursor:pointer}
.seg button.on{background:var(--s3);color:var(--t1)}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.lg{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--s2);color:var(--t2)}
.cell{display:flex;align-items:center;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px 20px 0}
.cardx{border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.cardx b{font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#8F8F8F)}
.tw{overflow-x:auto;padding:0 20px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{background:var(--s1);color:var(--t3);font-weight:400;text-align:left;padding:9px 10px;white-space:nowrap}
thead th:first-child{border-radius:8px 0 0 8px}thead th:last-child{border-radius:0 8px 8px 0}
td{padding:0 10px;height:48px;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody tr:hover td{background:var(--s1)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.cb{width:16px;height:16px;margin:0;accent-color:#8F8F8F;vertical-align:middle}
.hot{color:#F87171}.light .hot{color:#B91C1C}
.foot{display:flex;align-items:center;gap:10px;padding:14px 20px;margin-top:auto;flex-wrap:wrap}

.aiw{flex:none;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:20}
.fit .aiw{position:relative;height:100%}
@media (max-width:760px){.aiw{display:none}}

/* gen17: one table size across the app */
table{font-size:13.5px;line-height:18px}
thead th{font-size:13px;padding-top:7px;padding-bottom:7px;height:34px}
tbody tr>td{height:36px!important;padding-top:3px;padding-bottom:3px}
tbody td .sub{font-size:11.5px;line-height:14px}
tfoot td{height:38px}
table .tag{height:20px;font-size:11.5px;padding:0 7px}
table .btn.sm{height:26px;padding:0 9px;font-size:12.5px}
table .cin,table .inp{height:28px;font-size:13.5px}

/* gen27: collapsible sidebar */
.sbw{transition:flex-basis .18s ease,width .18s ease}
.sbw:has(.sbc){flex:0 0 64px!important;width:64px!important;max-width:64px!important;min-width:64px!important}
</style>
</helmet>
<div class="app {{theme}}">
<div class="sbw"><dc-import name="Sidebar" theme="{{theme}}" active="out" hint-size="236px,960px"></dc-import></div>
<div class="main">
<header class="hdr">
<div class="bc"><span>Outstanding</span></div>
<div class="seg" role="group" aria-label="Receivable or payable"><button type="button" class="{{rc}}" onClick="{{setR}}">Receivable</button><button type="button" class="{{py}}" onClick="{{setP}}">Payable</button></div>
<button class="btn" type="button" onClick="{{exportCsv}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Export</button>
<button class="btn pr" type="button" onClick="{{bulkGo}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>{{bulk}}</button>
</header>

<div class="cards">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="5"><div class="cardx"><span class="dot" style="{{c.st}}"><span class="muted">{{c.l}}</span></span><b>{{c.v}}</b></div></sc-for>
</div>

<div class="fbar">
<input class="inp" type="text" placeholder="Party" aria-label="Party" value="{{fq}}" onChange="{{setFq}}">
<select class="inp" aria-label="Group by" value="{{gb}}" onChange="{{setGb}}"><sc-for list="{{gbOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.l}}</option></sc-for></select>
<select class="inp" aria-label="City" value="{{fc}}" onChange="{{setFc}}"><option value="">City</option><sc-for list="{{cities}}" as="o" hint-placeholder-count="3"><option>{{o}}</option></sc-for></select>
<select class="inp" aria-label="Broker" value="{{fb}}" onChange="{{setFb}}"><option value="">Broker</option><sc-for list="{{brokers}}" as="o" hint-placeholder-count="1"><option>{{o}}</option></sc-for></select>
<select class="inp" aria-label="Age" value="{{fa}}" onChange="{{setFa}}"><option value="">Any age</option><option value="od">Overdue only</option><option value="30">Above 30 days</option><option value="60">Above 60 days</option><option value="90">Above 90 days</option></select>
<div style="flex: 1"></div>
<select class="inp" aria-label="Ageing basis" value="{{basis}}" onChange="{{setBasis}}"><option value="bill">Age from bill date</option><option value="due">Age from due date</option></select>
<div class="seg" role="group" aria-label="View"><button type="button" class="{{vwP}}" onClick="{{setVwP}}">Summary</button><button type="button" class="{{vwB}}" onClick="{{setVwB}}">Bill-wise</button></div>
</div>

<div class="tw"><table>
<thead><tr><th style="width: 36px"><input class="cb" type="checkbox" aria-label="Select all" checked="{{allOn}}" onChange="{{togAll}}"></th><th>{{h1}}</th><th>{{h2}}</th><th class="r">Total</th><th class="r">0–30</th><th class="r">31–60</th><th class="r">61–90</th><th class="r">90+</th><th>{{h9}}</th><th></th></tr></thead>
<tbody>
<sc-if value="{{back}}" hint-placeholder-val="{{false}}"><tr><td></td><td colspan="9"><button class="btn sm gh" type="button" onClick="{{goBack}}">← {{backL}}</button></td></tr></sc-if>
<sc-for list="{{rows}}" as="x" hint-placeholder-count="8">
<tr><td><input class="cb" type="checkbox" aria-label="Select party" checked="{{x.on}}" onChange="{{x.tog}}"></td><td><a class="cell" href="Ledger.dc.html" onClick="{{x.open}}"><span class="lg">{{x.i}}</span>{{x.n}}</a></td><td class="t2">{{x.c}}</td><td class="r" style="font-weight: 500">{{x.t}}</td><td class="r t2">{{x.a}}</td><td class="r t2">{{x.b}}</td><td class="r"><span class="{{x.dc}}">{{x.d}}</span></td><td class="r"><span class="{{x.ec}}">{{x.e}}</span></td><td class="muted">{{x.lp}}</td><td class="r"><button class="btn sm" type="button" onClick="{{x.act}}">{{x.al}}</button></td></tr>
</sc-for>
<sc-if value="{{none}}" hint-placeholder-val="{{false}}"><tr><td colspan="10" class="muted" style="text-align: center; padding: 28px">Nothing outstanding for these filters</td></tr></sc-if>
</tbody>
<tfoot><tr><td></td><td>{{ft.l}}</td><td></td><td class="r">{{ft.t}}</td><td class="r">{{ft.a}}</td><td class="r">{{ft.b}}</td><td class="r">{{ft.d}}</td><td class="r">{{ft.e}}</td><td></td><td></td></tr></tfoot></table></div>
<div class="foot"><span class="muted">{{footer}}</span><div style="flex: 1"></div><sc-if value="{{more}}" hint-placeholder-val="{{true}}"><button class="btn" type="button" onClick="{{loadMore}}">Load More</button></sc-if></div>
</div>
<div class="aiw"><dc-import name="Assistant" theme="{{theme}}" page="out" hint-size="52px,960px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1440,"height":960}}'>

    const res = st.res;

        on, tog: () => this.setState({ sel: on ? sel.filter((x) => x !== 'g' + g.k) : sel.concat(['g' + g.k]) }), open: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ drill: g.k, sel: [] }); }, act: () => this.setState({ drill: g.k, sel: [] }), al: 'Parties' }; });
      h1 = (GB.find((x) => x[0] === st.gb) || [0, ''])[1]; h2 = 'Parties'; h9 = 'Overdue';
      total = gs.reduce((a, g) => a + g.net, 0); count = gs.length;
      const tb = [0, 1, 2, 3].map((i) => gs.reduce((a, g) => a + g.b[i], 0));
      ft = { l: gs.length + ' groups', t: inr(total), a: inr(tb[0]), b: inr(tb[1]), d: inr(tb[2]), e: inr(tb[3]) };
      common.footerX = rows.length + ' of ' + gs.length + ' · ' + L(total) + (r ? ' receivable' : ' payable');
    } else {
      rows = parties.slice(0, st.lim).map((p) => { const on = sel.indexOf('p' + p.partyId) >= 0; const b = p.buckets;
        return { i: p.partyName.replace(/^(Shree|Shri|The)\s+/i, '').charAt(0), n: p.partyName + (p.overLimit ? ' · over limit' : ''), c: (p.city || '—') + (Math.abs(p.onAccount) > 0.5 ? ' · ' + (p.onAccount < 0 ? 'advance ' : 'on a/c ') + L(Math.abs(p.onAccount)) : ''), t: inr(p.net), a: dash(b[0]), b: dash(b[1]), d: dash(b[2]), e: dash(b[3]), dc: b[2] ? 'hot' : 'muted', ec: b[3] ? 'hot' : 'muted', lp: dd(p.lastPayment),
          on, tog: () => this.setState({ sel: on ? sel.filter((x) => x !== 'p' + p.partyId) : sel.concat(['p' + p.partyId]) }), open: ledger(p.partyId), act: () => (r ? remind(p) : pay(p)), al: r ? 'Remind' : 'Pay' }; });
      total = parties.reduce((a, p) => a + p.net, 0); count = parties.length;
      const tb = [0, 1, 2, 3].map((i) => parties.reduce((a, p) => a + (p.buckets[i] || 0), 0));
      ft = { l: parties.length + ' parties', t: inr(total), a: inr(tb[0]), b: inr(tb[1]), d: inr(tb[2]), e: inr(tb[3]) };
      common.footerX = rows.length + ' of ' + parties.length + (r ? ' parties' : ' mills') + ' · ' + L(total) + (r ? ' receivable' : ' payable');
    }
    const T = res.totals; const B = T.buckets || [0, 0, 0, 0];
    const notDue = res.parties.reduce((a, p) => a + p.billsPending - p.overdue, 0);
    const adv = res.parties.reduce((a, p) => a + (p.onAccount < 0 ? -p.onAccount : 0), 0);
    const cards = r ? [{ l: 'Total receivable', v: L(T.net), st: stc('#3B82F6') }, { l: '0–30 days', v: L(B[0]), st: stc('#8F8F8F') }, { l: '31–60 days', v: L(B[1]), st: stc('#F97316') }, { l: '61–90 days', v: L(B[2]), st: stc('#EF4444') }, { l: '90+ days', v: L(B[3]), st: stc('#B91C1C') }]
      : [{ l: 'Total payable', v: L(T.net), st: stc('#3B82F6') }, { l: '0–30 days', v: L(B[0]), st: stc('#F97316') }, { l: 'Not yet due', v: L(notDue), st: stc('#8F8F8F') }, { l: 'Overdue', v: L(T.overdue), st: stc('#EF4444') }, { l: 'Advances paid', v: L(adv), st: stc('#A855F7') }];
    const selParties = res.parties.filter((p) => sel.indexOf('p' + p.partyId) >= 0);
    const csv = () => { const head = [h1, h2, 'Total', '0-30', '31-60', '61-90', '90+', h9]; const lines = [head].concat(rows.map((x) => [x.n, x.c, x.t, x.a, x.b, x.d, x.e, x.lp])); return lines.map((a) => a.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'); };
    return { ...common, cards, rows, h1, h2, h9, ft, none: rows.length === 0,
      setR: () => this.load({ mode: 'r', sel: [], drill: null }), setP: () => this.load({ mode: 'p', sel: [], drill: null }),
      back: !!st.drill, backL: 'All ' + (GB.find((x) => x[0] === st.gb) || [0, ''])[1].toLowerCase() + ' · ' + (st.drill || ''), goBack: () => this.setState({ drill: null, sel: [] }),
      allOn: rows.length > 0 && rows.every((x) => x.on), togAll: () => { const all = rows.every((x) => x.on); rows.forEach(() => {}); this.setState({ sel: all ? [] : (st.vw === 'b' ? res.bills.filter((b) => pid.has(b.partyId)).slice(0, st.lim).map((b) => 'b' + b.id) : st.gb !== 'party' && !st.drill ? [] : parties.slice(0, st.lim).map((p) => 'p' + p.partyId)) }); },
      cities: [...new Set(res.parties.map((p) => p.city).filter(Boolean))].sort(), brokers: [...new Set(res.parties.map((p) => p.brokerName).filter(Boolean))].sort(),
      exportCsv: () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv()], { type: 'text/csv' })); a.download = 'Outstanding ' + (r ? 'receivable' : 'payable') + '.csv'; a.click(); } catch (e) {} },
      bulkGo: () => { if (!r) { this.go('Payments' + sfx + '.dc.html'); try { window.localStorage.setItem('yf-pay-kind', 'p'); } catch (e) {} return; } const list = selParties.length ? selParties : res.parties.filter((p) => p.overdue > 0); if (!list.length) return; if (list.length > 1 && !window.confirm('Open WhatsApp reminders for ' + list.length + ' parties?')) return; list.slice(0, 15).forEach(remind); },
      more: rows.length < count, loadMore: () => this.setState({ lim: st.lim + 50 }), footer: common.footerX };
  }
}
