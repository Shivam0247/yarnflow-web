<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YarnFlow · Voucher register</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.dark{--bg:#141414;--sb:#1B1B1B;--s1:#1E1E1E;--s2:#262626;--s3:#2E2E2E;--bd:#262626;--bd2:#383838;--t1:#EDEDED;--t2:#B5B5B5;--t3:#8F8F8F;--ib:#F5F5F5;--it:#171717;--pop:#1E1E1E;color-scheme:dark}
.light{--bg:#FFFFFF;--sb:#F8F8F8;--s1:#F7F7F7;--s2:#F1F1F1;--s3:#E9E9E9;--bd:#ECECEC;--bd2:#DDDDDD;--t1:#171717;--t2:#525252;--t3:#6B6B6B;--ib:#171717;--it:#FFFFFF;--pop:#FFFFFF;color-scheme:light}
.app{display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--t1)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.sbw{flex:0 0 236px;height:100%;overflow-y:auto;background:var(--sb);border-right:1px solid var(--bd)}
.main{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.main>*{flex:none}
.hdr{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bc{display:flex;align-items:center;gap:8px;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap}
.bc .m{color:var(--t3)}
.bc a.m{cursor:pointer;border-radius:6px;padding:3px 6px;margin:0 -2px 0 -6px}
.bc a.m:hover{color:var(--t1);background:var(--s2);text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:0;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--s2);color:var(--t1)}
.btn:hover{background:var(--s3)}
.btn.pr{background:var(--ib);color:var(--it)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.gh{background:transparent}.btn.gh:hover{background:var(--s2)}
.btn.no{background:rgba(239,68,68,.14);color:#F87171}
.btn.ok{background:#16A34A;color:#fff}
.inp{height:32px;border-radius:8px;border:1px solid transparent;background:var(--s2);padding:0 10px;font-size:14px;color:var(--t1);min-width:0}
.inp::placeholder{color:var(--t3)}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--s2);color:var(--t2)}
.t-green{background:rgba(34,197,94,.14);color:#4ADE80}.t-orange{background:rgba(249,115,22,.15);color:#FB923C}.t-red{background:rgba(239,68,68,.15);color:#F87171}.t-blue{background:rgba(59,130,246,.16);color:#60A5FA}.t-gray{background:var(--s2);color:var(--t2)}.t-purple{background:rgba(168,85,247,.16);color:#C084FC}
.light .t-green{color:#15803D}.light .t-orange{color:#C2410C}.light .t-red{color:#B91C1C}.light .t-blue{color:#1D4ED8}.light .t-purple{color:#7E22CE}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:9px 10px;color:var(--t3);border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--t1);border-bottom-color:var(--t1)}
.tab .n{font-size:12px;background:var(--s2);border-radius:6px;padding:0 6px;color:var(--t2);font-variant-numeric:tabular-nums}
.dot{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#8F8F8F)}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 20px;flex-wrap:wrap}
.bulk{display:flex;align-items:center;gap:8px;padding:6px 20px;background:rgba(59,130,246,.10);border-top:1px solid rgba(59,130,246,.25);border-bottom:1px solid rgba(59,130,246,.25);flex-wrap:wrap;font-size:13.5px}
.okbar{display:flex;align-items:center;gap:10px;margin:0 20px 8px;padding:8px 12px;border-radius:8px;background:rgba(34,197,94,.12);color:#4ADE80;font-size:13.5px}
.light .okbar{color:#15803D}
.okbar button{margin-left:auto;border:0;background:transparent;color:inherit;cursor:pointer}
.reg{flex:1 1 auto!important;min-height:0;overflow:auto;margin:0 20px 12px;border:1px solid var(--bd);border-radius:10px}
table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.reg>table.cft{min-height:100%}
thead th{background:var(--s1);color:var(--t3);font-weight:400;text-align:left;padding:0 9px;white-space:nowrap;border-bottom:1px solid var(--bd)}
td{padding:0 9px;border-bottom:1px solid var(--bd);white-space:nowrap}
.r{text-align:right;font-variant-numeric:tabular-nums}
.cbx{width:15px;height:15px;margin:0;accent-color:#3B82F6;vertical-align:middle;cursor:pointer}
.reg tbody tr:nth-child(even)>td{background:rgba(255,255,255,.04)}
.light .reg tbody tr:nth-child(even)>td{background:#F6F7F9}
.reg tbody tr:hover>td{background:var(--s2)}
.reg tbody tr.sel>td{background:rgba(59,130,246,.22)!important}
.light .reg tbody tr.sel>td{background:#DBEAFE!important}
.reg tbody tr.sel>td:first-child{box-shadow:inset 3px 0 0 #3B82F6}
.cft tbody tr:not(.fillr):not(.more){cursor:pointer;user-select:none}
.cft tbody tr.fillr>td{height:auto!important;padding:0!important;border:0!important;background:transparent!important}
.cft tbody tr.more>td{height:40px!important;text-align:center;color:var(--t3);font-size:13px;background:transparent!important}
.cft tfoot td{position:sticky;bottom:0;z-index:4;background:var(--s2);font-weight:600;border-top:1px solid var(--bd2);border-bottom:0;white-space:nowrap}
.cft td.lnk{color:var(--t1);font-weight:500;text-decoration:underline;text-decoration-color:var(--bd2);text-underline-offset:3px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd2);border-top-color:#3B82F6;border-radius:50%;animation:sp .8s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.aiw{flex:none;height:100vh}
@media (max-width:760px){.aiw{display:none}.sbw{display:none}}

/* gen11: column sort + filter */
.cft thead th{position:sticky;top:0;z-index:5}
.cft thead th.fh{padding:0}
.fb{display:flex;align-items:center;gap:5px;width:100%;height:38px;padding:0 10px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;white-space:nowrap;text-align:left;border-radius:6px}
th.r .fb{justify-content:flex-end}
.fb:hover{color:var(--t1);background:var(--s2)}
.fb .fi{opacity:.0;flex:none;transition:opacity .12s}
.fb:hover .fi,.fb.on .fi,.fb.op .fi{opacity:1}
.fb.on{color:#3B82F6}.fb.on .fi{color:#3B82F6}
.fb .si{font-size:12px;color:#3B82F6;font-weight:600}
.fpbk{position:fixed;inset:0;z-index:30;cursor:default}
.fp{position:absolute;top:calc(100% + 2px);left:0;z-index:31;width:264px;background:var(--pop,var(--bg));border:1px solid var(--bd2);border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column;gap:2px;text-align:left;font-weight:400;font-size:13px;color:var(--t1);cursor:default;white-space:normal}
.light .fp{box-shadow:0 14px 36px rgba(0,0,0,.12)}
.fp.rt{left:auto;right:0}
.fpi{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--t1);font:inherit;font-size:13px;cursor:pointer;text-align:left;width:100%}
.fpi:hover{background:var(--s2)}
.fpi.on{color:#3B82F6;font-weight:500}
.fpi svg{flex:none;color:var(--t3)}.fpi.on svg{color:#3B82F6}
.fpsep{height:1px;background:var(--bd);margin:4px 2px}
.fpt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:2px 8px}
.fps{height:32px;border:1px solid var(--bd2);border-radius:7px;background:var(--s1);padding:0 9px;font:inherit;font-size:13px;color:var(--t1);margin:2px 0 4px;outline:0;width:100%}
.fps:focus{border-color:#3B82F6}
.fpl{max-height:216px;overflow-y:auto;display:flex;flex-direction:column}
.fpo{display:flex;align-items:center;gap:9px;min-height:30px;padding:0 8px;border-radius:6px;font-size:13px;cursor:pointer}
.fpo:hover{background:var(--s2)}
.fpo input{width:15px;height:15px;margin:0;accent-color:#3B82F6;flex:none;cursor:pointer}
.fpo .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpo .n{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.fpo.all{font-weight:500}
.fpe{padding:10px 8px;color:var(--t3);font-size:12.5px}
.fpf{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 2px 0;border-top:1px solid var(--bd);margin-top:4px}
.fchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 20px 10px;font-size:13px}
.fchips .lbl{color:var(--t3)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 3px 0 10px;border-radius:7px;background:rgba(59,130,246,.14);color:var(--t1);font-size:12.5px;white-space:nowrap}
.fchip b{font-weight:600}
.fchip button{width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:var(--t2);cursor:pointer;display:grid;place-items:center;padding:0}
.fchip button:hover{background:rgba(59,130,246,.28);color:var(--t1)}
.fclr{border:0;background:transparent;color:#3B82F6;font:inherit;font-size:12.5px;cursor:pointer;padding:0 6px}
.cft td.it{font-weight:500}
.cft .den{font-variant-numeric:tabular-nums}

/* gen17: one table size across the app */
table{font-size:13.5px;line-height:18px}
thead th{font-size:13px;padding-top:7px;padding-bottom:7px;height:34px}
tbody tr>td{height:36px!important;padding-top:3px;padding-bottom:3px}
tbody td .sub{font-size:11.5px;line-height:14px}
tfoot td{height:38px}
table .tag{height:20px;font-size:11.5px;padding:0 7px}
table .btn.sm{height:26px;padding:0 9px;font-size:12.5px}
table .cin,table .inp{height:28px;font-size:13.5px}

/* gen27: collapsible sidebar */
.sbw{transition:flex-basis .18s ease,width .18s ease}
.sbw:has(.sbc){flex:0 0 64px!important;width:64px!important;max-width:64px!important;min-width:64px!important}
</style>
</helmet>
<div class="app {{theme}}">
<div class="sbw"><dc-import name="Sidebar" theme="{{theme}}" active="{{kind}}" hint-size="236px,1000px"></dc-import></div>
<div class="main">
<header class="hdr">
<div class="bc"><span class="m">{{k.mod}}</span><span class="m">/</span><span>{{k.reg}}</span></div>
<button class="btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>Print</button>
<button class="btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Excel</button>
<a class="btn pr" href="{{newHref}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>{{newLabel}}</a>
</header>
<div class="tabs" role="tablist" aria-label="Status">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="{{t.cls}}" type="button" role="tab" onClick="{{t.pick}}"><span class="dot" style="{{t.c}}">{{t.l}}</span><span class="n">{{t.n}}</span></button></sc-for>
</div>
<div class="fbar">
<input class="inp" type="text" value="01-04-2026" aria-label="From date" style="max-width: 120px"><span class="muted">to</span><input class="inp" type="text" value="24-10-2026" aria-label="To date" style="max-width: 120px">
</div>
<sc-if value="{{cf.hasChips}}" hint-placeholder-val="{{false}}"><div class="fchips" role="status"><span class="lbl">Showing</span><sc-for list="{{cf.chips}}" as="c" hint-placeholder-count="2"><span class="fchip">{{c.l}}: <b>{{c.v}}</b><button type="button" onClick="{{c.x}}" aria-label="Remove filter"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span></sc-for><button class="fclr" type="button" onClick="{{cf.clearAll}}">Clear all</button></div></sc-if>
<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}"><div class="bulk" role="toolbar" aria-label="Bulk actions"><b style="font-weight: 600">{{selCount}} selected</b><span class="muted" style="flex: 1">{{selNote}}</span><sc-for list="{{bulk}}" as="b" hint-placeholder-count="3"><button class="{{b.cls}}" type="button" onClick="{{b.go}}">{{b.l}}</button></sc-for><button class="btn sm gh" type="button" onClick="{{clearSel}}">Clear</button></div></sc-if>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}"><div class="okbar" role="status"><span>✓</span><span>{{toast}}</span><button type="button" onClick="{{hideToast}}" aria-label="Dismiss">✕</button></div></sc-if>
<div class="reg" onScroll="{{onScroll}}"><table class="cft">
<thead><tr><th style="width: 34px"><input class="cbx" type="checkbox" aria-label="Select all" checked="{{allOn}}" onChange="{{toggleAll}}"></th><sc-for list="{{cf.heads}}" as="h" hint-placeholder-count="12"><th class="{{h.thc}}"><button class="{{h.btn}}" type="button" onClick="{{h.toggle}}" aria-haspopup="dialog" aria-expanded="{{h.open}}" title="Sort and filter">{{h.l}}<span class="si">{{h.ic}}</span><svg class="fi" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button><sc-if value="{{h.open}}" hint-placeholder-val="{{false}}"><div class="fpbk" onClick="{{h.close}}"></div><div class="{{h.popCls}}" role="dialog" aria-label="Sort and filter"><button class="{{h.ascC}}" type="button" onClick="{{h.asc}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>{{h.ascL}}</button><button class="{{h.descC}}" type="button" onClick="{{h.desc}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>{{h.descL}}</button><div class="fpsep"></div><div class="fpt">Filter {{h.l}}</div><input class="fps" type="search" value="{{h.q}}" onChange="{{h.setQ}}" placeholder="Search values" aria-label="Search values" autoFocus="{{ true }}"><label class="fpo all"><input type="checkbox" checked="{{h.allCk}}" onChange="{{h.selAll}}"><span class="v">Select all</span><span class="n">{{h.nOpts}}</span></label><div class="fpl"><sc-for list="{{h.opts}}" as="o" hint-placeholder-count="6"><label class="fpo"><input type="checkbox" checked="{{o.ck}}" onChange="{{o.tog}}"><span class="v">{{o.v}}</span><span class="n">{{o.n}}</span></label></sc-for><sc-if value="{{h.noOpts}}" hint-placeholder-val="{{false}}"><div class="fpe">No matching values</div></sc-if></div><div class="fpf"><button class="btn sm gh" type="button" onClick="{{h.clear}}">Clear filter</button><button class="btn sm pr" type="button" onClick="{{h.close}}">Done</button></div></div></sc-if></th></sc-for></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="x" hint-placeholder-count="14">
<tr class="{{x.rc}}" onClick="{{x.rowClick}}" onDoubleClick="{{x.open}}" title="Click to select · double-click to open"><td><input class="cbx" type="checkbox" aria-label="Select record" checked="{{x.on}}" onChange="{{x.tog}}"></td><sc-for list="{{x.cells}}" as="c" hint-placeholder-count="10"><td class="{{c.cls}}"><sc-if value="{{c.isTag}}" hint-placeholder-val="{{false}}"><span class="{{c.tc}}">{{c.v}}</span></sc-if><sc-if value="{{c.isTxt}}" hint-placeholder-val="{{true}}">{{c.v}}</sc-if></td></sc-for></tr>
</sc-for>
<sc-if value="{{moreLeft}}" hint-placeholder-val="{{false}}"><tr class="more"><td colspan="{{span}}"><span class="spin" aria-hidden="true"></span>Loading more as you scroll · {{loadedLabel}}</td></tr></sc-if>
<sc-if value="{{allLoaded}}" hint-placeholder-val="{{false}}"><tr class="more"><td colspan="{{span}}">All {{countLabel}} shown</td></tr></sc-if>
<tr class="fillr" aria-hidden="true"><td colspan="{{span}}"></td></tr>
</tbody>
<tfoot><tr><td></td><sc-for list="{{foot}}" as="f" hint-placeholder-count="10"><td class="{{f.cls}}">{{f.v}}</td></sc-for></tr></tfoot>
</table></div>
</div>
<div class="aiw"><dc-import name="Assistant" theme="{{theme}}" page="{{aiPage}}" hint-size="52px,960px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"kind":{"editor":"enum","default":"ds","options":["ds","gs","sr","gp","pr"]},"$preview":{"width":1440,"height":1000}}'>

  gp: ['PUROHIT HANSRAJ VELAJI', 'DISHA TEXTECH & GENERAL TRADING', 'SHEKHAWATI ROAD CARRIER', 'DURGA KANWAR', 'SWASTIK TRANSPORT SERVICE', 'UNITED GUJARAT YARN DEALERS ASSOCIATION', 'SHAURYA TEMPO SERVICE', 'MAA ROADLINES', 'LALIT ROAD CARRIER', 'TRI WORLD EXIM SERVICES LLP', 'COMMERCIAL GOODS CARRIERS'],

      onScroll: (e) => { const el = e.currentTarget || e.target; if (!el || this._ld || !this._more) return; if (el.scrollTop + el.clientHeight >= el.scrollHeight - 160) { this._ld = true; setTimeout(() => { this._ld = false; this.setState({ loaded: this.state.loaded + 20 }); }, 350); } },
      moreLeft: shown.length < vis.length, allLoaded: vis.length > 0 && shown.length >= vis.length, loadedLabel: shown.length + ' of ' + vis.length + ' loaded', countLabel: vis.length + ' ' + K.nouns
    };
  }
}
