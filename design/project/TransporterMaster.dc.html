<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YarnFlow · Transporters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.dark{--bg:#141414;--sb:#1B1B1B;--s1:#1E1E1E;--s2:#262626;--s3:#2E2E2E;--bd:#262626;--bd2:#383838;--t1:#EDEDED;--t2:#B5B5B5;--t3:#8F8F8F;--ib:#F5F5F5;--it:#171717;color-scheme:dark}
.light{--bg:#FFFFFF;--sb:#F8F8F8;--s1:#F7F7F7;--s2:#F1F1F1;--s3:#E9E9E9;--bd:#ECECEC;--bd2:#DDDDDD;--t1:#171717;--t2:#525252;--t3:#6B6B6B;--ib:#171717;--it:#FFFFFF;color-scheme:light}
.app{display:flex;flex-wrap:wrap;min-height:100vh;background:var(--bg);color:var(--t1)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.sbw{flex:1 1 236px;max-width:100%;background:var(--sb);border-right:1px solid var(--bd)}
.main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bc{display:flex;align-items:center;gap:8px;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap}
.bc .m{color:var(--t3)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:0;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--s2);color:var(--t1)}
.btn:hover{background:var(--s3)}
.btn.pr{background:var(--ib);color:var(--it)}
.btn.gh{background:transparent}.btn.gh:hover{background:var(--s2)}
.inp{height:34px;border-radius:8px;border:1px solid transparent;background:var(--s2);padding:0 10px;font-size:14px;color:var(--t1);min-width:0}
.inp::placeholder{color:var(--t3)}
.fbar{display:flex;align-items:center;gap:8px;padding:14px 20px;flex-wrap:wrap}
.fbar .inp{flex:1 1 130px;max-width:180px}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.dot{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#8F8F8F)}
.lg{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--s2);color:var(--t2)}
.cell{display:flex;align-items:center;gap:10px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--s2);color:var(--t2)}
.tw{overflow-x:auto;padding:0 20px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{background:var(--s1);color:var(--t3);font-weight:400;text-align:left;padding:9px 10px;white-space:nowrap}
thead th:first-child{border-radius:8px 0 0 8px}thead th:last-child{border-radius:0 8px 8px 0}
td{padding:0 10px;height:52px;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody tr:hover td{background:var(--s1)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.cb{width:16px;height:16px;margin:0;accent-color:#8F8F8F;vertical-align:middle}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:16px 20px 0}
.cardx{border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.cardx b{font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.foot{display:flex;align-items:center;gap:10px;padding:14px 20px;margin-top:auto;flex-wrap:wrap}

.aiw{flex:none;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:20}
.fit .aiw{position:relative;height:100%}
@media (max-width:760px){.aiw{display:none}}

/* gen17: one table size across the app */
table{font-size:13.5px;line-height:18px}
thead th{font-size:13px;padding-top:7px;padding-bottom:7px;height:34px}
tbody tr>td{height:36px!important;padding-top:3px;padding-bottom:3px}
tbody td .sub{font-size:11.5px;line-height:14px}
tfoot td{height:38px}
table .tag{height:20px;font-size:11.5px;padding:0 7px}
table .btn.sm{height:26px;padding:0 9px;font-size:12.5px}
table .cin,table .inp{height:28px;font-size:13.5px}

/* gen27: collapsible sidebar */
.sbw{transition:flex-basis .18s ease,width .18s ease}
.sbw:has(.sbc){flex:0 0 64px!important;width:64px!important;max-width:64px!important;min-width:64px!important}
.scrim.fmx{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:56px 16px;z-index:30}
.fmx .modal{width:min(860px,100%);background:var(--pop,var(--bg));border:1px solid var(--bd2);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.45);display:flex;flex-direction:column;max-height:calc(100vh - 112px)}
.fmx .mh{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.fmx .mh h2{margin:0;font-size:19px;font-weight:600;flex:1}
.fmx .fmb{overflow:auto;padding-bottom:6px}
.fmx .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px;padding:10px 20px}
.fmx .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fmx .fld>label{color:var(--t3);font-size:13px}
.fmx .fld .inp{width:100%;max-width:none;height:34px}
.fmx .sub{padding:12px 20px 0;font-weight:600;font-size:13px}
.fmx .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bd)}
.fmx .sw{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--s3);position:relative;cursor:pointer;margin:0;flex:none}
.fmx .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.fmx .sw:checked{background:#22C55E}
.fmx .sw:checked::after{left:16px}
</style>
</helmet>
<div class="app {{theme}}">
<div class="sbw"><dc-import name="Sidebar" theme="{{theme}}" active="trn" hint-size="236px,960px"></dc-import></div>
<div class="main">
<header class="hdr">
<div class="bc"><span class="m">Transporters</span><span class="m">/</span><button class="btn gh" type="button" style="font-size: 17px; font-weight: 400; padding: 0 8px; height: 32px">List<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
<button class="btn" type="button" onClick="{{lrReg}}">LR register</button>
<button class="btn pr" type="button" onClick="{{open}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Create</button>
</header>
<div class="cards">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4"><div class="cardx"><span class="muted">{{c.l}}</span><b>{{c.v}}</b></div></sc-for>
</div>
<div class="fbar">
<input class="inp" type="text" placeholder="Name" aria-label="Transporter name" value="{{fq}}" onChange="{{setFq}}">
<input class="inp" type="text" placeholder="Route" aria-label="Route" value="{{fr}}" onChange="{{setFr}}">
<select class="inp" aria-label="Rate basis" value="{{fb}}" onChange="{{setFb}}"><option value="">Rate basis</option><option value="PER_KG">Per kg</option><option value="PER_BOX">Per box</option><option value="PER_TRIP">Per trip</option></select>
<div style="flex: 1"></div>
<button class="btn" type="button" onClick="{{exportCsv}}">Excel</button>
</div>
<div class="tw"><table>
<thead><tr><th style="width: 36px"><input class="cb" type="checkbox" aria-label="Select all"></th><th>Transporter</th><th>Transporter ID</th><th>Main routes</th><th class="r">Rate</th><th class="r">In transit</th><th class="r">On-time</th><th class="r">Freight due</th><th>Contact</th><th>Status</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="x" hint-placeholder-count="8">
<tr onDoubleClick="{{x.edit}}"><td><input class="cb" type="checkbox" aria-label="Select transporter"></td><td><span class="cell"><span class="lg">{{x.i}}</span>{{x.n}}</span></td><td class="t2" style="font-variant-numeric: tabular-nums">{{x.id}}</td><td><span class="tag">{{x.r1}}</span> <span class="muted" style="font-size: 13px">{{x.more}}</span></td><td class="r">{{x.rate}}</td><td class="r">{{x.lr}}</td><td class="r">{{x.ot}}</td><td class="r">{{x.due}}</td><td class="t2">{{x.ph}}</td><td><span class="dot" style="{{x.sc}}">{{x.s}}</span> <button class="btn sm gh" type="button" onClick="{{x.edit}}">Edit</button></td></tr>
</sc-for>
</tbody></table></div>
<div class="foot"><span class="muted">{{count}}</span><div style="flex: 1"></div></div>
</div>
<sc-if value="{{fm.open}}" hint-placeholder-val="{{false}}">
<div class="scrim fmx">
<div class="modal" role="dialog" aria-label="{{fm.title}}">
<div class="mh"><h2>{{fm.title}}</h2><button class="btn gh ic" type="button" aria-label="Close" onClick="{{fm.close}}">✕</button></div>
<div class="fmb">
<sc-for list="{{fm.secs}}" as="sec" hint-placeholder-count="3"><div class="sub">{{sec.t}}</div><div class="fgrid"><sc-for list="{{sec.f}}" as="f" hint-placeholder-count="6"><div class="fld"><label>{{f.l}}<span style="color: #EF4444">{{f.req}}</span></label>
<sc-if value="{{f.isSel}}" hint-placeholder-val="{{false}}"><select class="inp" aria-label="{{f.l}}" value="{{f.v}}" onChange="{{f.on}}"><sc-for list="{{f.opts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.l}}</option></sc-for></select></sc-if>
<sc-if value="{{f.isIn}}" hint-placeholder-val="{{true}}"><input class="inp" type="text" aria-label="{{f.l}}" value="{{f.v}}" placeholder="{{f.ph}}" onChange="{{f.on}}"></sc-if>
<sc-if value="{{f.isChk}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 10px; min-height: 34px"><input class="sw" type="checkbox" aria-label="{{f.l}}" checked="{{f.c}}" onChange="{{f.on}}"><span class="t2">{{f.ph}}</span></span></sc-if>
</div></sc-for></div></sc-for>
</div>
<div class="mf"><span class="{{fm.nc}}" style="flex: 1; align-self: center; font-size: 13px">{{fm.note}}</span><sc-if value="{{fm.canDel}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" style="color: #F87171" onClick="{{fm.del}}">Delete</button></sc-if><button class="btn" type="button" onClick="{{fm.close}}">Cancel</button><button class="btn pr" type="button" onClick="{{fm.save}}" disabled="{{fm.busy}}">{{fm.saveL}}</button></div>
</div>
</div>
</sc-if>
<div class="aiw"><dc-import name="Assistant" theme="{{theme}}" page="trn" hint-size="52px,960px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { fq: '', fr: '', fb: '', fm: null }; }
  api() { return typeof window !== 'undefined' && window.YF_API && window.YF_API.session ? window.YF_API : null; }
  go(h) { try { const a = document.createElement('a'); a.href = h; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {} }
  /* ---- generic master form (spec → sections of fields) ---- */
  fmOpen(title, vals, id) { this.setState({ fm: { title, v: { ...vals }, id: id || null, note: '', err: false, busy: false } }); }
  fmVals(spec, fm) {
    const secs = spec.map((sec) => ({ t: sec.t, f: sec.f.map((x) => { const v = fm.v[x.k]; const on = (e) => this.setState({ fm: { ...this.state.fm, v: { ...this.state.fm.v, [x.k]: x.type === 'chk' ? e.target.checked : e.target.value }, note: '', err: false } });
      return { l: x.l, req: x.req ? ' *' : '', isSel: x.type === 'sel', isIn: !x.type || x.type === 'text', isChk: x.type === 'chk', v: v === null || v === undefined ? '' : String(v), c: !!v, ph: x.ph || '', opts: (x.opts || []).map((o) => ({ v: String(o[0]), l: o[1] })), on }; }) }));
    return { open: true, title: fm.title, secs, note: fm.note, nc: fm.err ? 'tag t-red' : 'muted', busy: !!fm.busy, canDel: !!fm.id, saveL: fm.busy ? 'Saving…' : fm.id ? 'Save changes' : 'Create', close: () => this.setState({ fm: null }) };
  }
  async fmSave(slug, body, done) {
    const api = this.api(); const fm = this.state.fm; if (!api) { this.setState({ fm: null }); return; }
    this.setState({ fm: { ...fm, busy: true, note: 'Saving…', err: false } });
    try { const r = fm.id ? await api.put('/masters/' + slug + '/' + fm.id, body) : await api.post('/masters/' + slug, body); api.invalidate(); this.setState({ fm: null, toast: '✓ Saved ' + (r.name || r.code || '') }); if (done) await done(r); }
    catch (e) { this.setState({ fm: { ...this.state.fm, busy: false, note: api.message(e), err: true } }); }
  }
  async fmDel(slug, done) {
    const api = this.api(); const fm = this.state.fm; if (!api || !fm.id) return;
    if (!window.confirm('Delete this record? It cannot be undone.')) return;
    try { await api.del('/masters/' + slug + '/' + fm.id); api.invalidate(); this.setState({ fm: null, toast: '✓ Deleted' }); if (done) await done(); }
    catch (e) { this.setState({ fm: { ...this.state.fm, note: api.message(e), err: true } }); }
  }
  num(v) { const n = Number(String(v ?? '').replace(/[₹,\s]/g, '')); return isNaN(n) ? 0 : n; }
  nz(v) { return v === '' || v === undefined ? null : v; }
  componentDidMount() { this.load(); }
  async load() { const api = this.api(); if (!api) return; try { const [t, lk, ew] = await Promise.all([api.get('/masters/transporters'), api.lookups(), api.get('/eway-bills')]); this.setState({ rows: t.data, lk, ew: ew.data }); } catch (e) { this.setState({ toast: api.message(e) }); } }
  spec() {
    const lk = this.state.lk || { ledgers: [] };
    return [{ t: 'Transporter', f: [{ k: 'name', l: 'Transporter name', req: 1 }, { k: 'transporterId', l: 'Transporter ID (GSTIN / TRANSIN)', ph: '24AAJFN3381Q1Z6' }, { k: 'gstin', l: 'GSTIN' }, { k: 'status', l: 'Status', type: 'sel', opts: [['ACTIVE', 'Active'], ['ON_HOLD', 'Paused'], ['BLOCKED', 'Blocked'], ['INACTIVE', 'Inactive']] }] },
      { t: 'Contact', f: [{ k: 'contactPerson', l: 'Contact person' }, { k: 'mobile', l: 'Mobile' }, { k: 'address', l: 'Address' }, { k: 'city', l: 'City' }] },
      { t: 'Routes & freight', f: [{ k: 'routes', l: 'Main routes', ph: 'Surat → Bhiwandi, Surat → Ichalkaranji' }, { k: 'rateBasis', l: 'Rate basis', type: 'sel', opts: [['PER_KG', 'Per kg'], ['PER_BOX', 'Per box'], ['PER_TRIP', 'Per trip']] }, { k: 'rate', l: 'Rate ₹' },
        { k: 'accountId', l: 'Freight ledger', type: 'sel', opts: [['', '—']].concat(lk.ledgers.filter((x) => x.kind === 'TRANSPORTER' || x.kind === 'SUPPLIER' || x.kind === 'EXPENSE').map((x) => [x.id, x.name])) }] }];
  }
  body(v) { const b = {}; ['name', 'transporterId', 'gstin', 'contactPerson', 'address', 'city', 'routes', 'rateBasis', 'status'].forEach((k) => { b[k] = this.nz(String(v[k] ?? '').trim()); }); b.mobile = v.mobile ? String(v.mobile).replace(/\D/g, '').slice(-10) || null : null; b.rate = this.num(v.rate); b.accountId = v.accountId ? Number(v.accountId) : null; return b; }
  renderVals() {
    const st = this.state; const theme = this.props.theme ?? 'dark'; const sfx = theme === 'light' ? 'Light' : '';
    const fmV = st.fm ? this.fmVals(this.spec(), st.fm) : { open: false };
    if (st.fm) { fmV.save = () => this.fmSave('transporters', this.body(st.fm.v), () => this.load()); fmV.del = () => this.fmDel('transporters', () => this.load()); }
    const base = { theme, fm: fmV, fq: st.fq, fr: st.fr, fb: st.fb, setFq: (e) => this.setState({ fq: e.target.value }), setFr: (e) => this.setState({ fr: e.target.value }), setFb: (e) => this.setState({ fb: e.target.value }),
      open: () => this.fmOpen('New transporter', { rateBasis: 'PER_KG', status: 'ACTIVE' }), lrReg: () => { try { window.localStorage.setItem('yf-report', 'ewb-register'); } catch (e) {} this.go('Reports' + sfx + '.dc.html'); } };
    if (!st.rows) {
    const mk = (i, n, id, r1, more, rate, lr, ot, due, ph, on) => ({ i, n, id, r1, more, rate, lr, ot, due, ph, s: on ? 'Active' : 'Paused', sc: '--c: ' + (on ? '#22C55E' : '#8F8F8F') });
    const rows = [
      mk('N', 'Navkar Roadlines', '24AAJFN3381Q1Z6', 'Surat → Bhiwandi', '+2 routes', '₹ 3.20/kg', '9', '97%', '₹ 48,200', '98984 22410', true),
      mk('J', 'Jay Ambe Roadlines', '24AAKFJ6619L1Z0', 'Silvassa → Surat', '+1 route', '₹ 2.10/kg', '6', '95%', '₹ 31,600', '98252 70014', true),
      mk('S', 'Sai Kripa Transport', '24ABUFS2207C1Z4', 'Surat → Ichalkaranji', '+3 routes', '₹ 3.60/kg', '5', '92%', '₹ 27,950', '99250 18840', true),
      mk('M', 'Mahalaxmi Cargo Movers', '24AAFFM9054R1Z8', 'Surat → Ludhiana', '+1 route', '₹ 6.80/kg', '4', '89%', '₹ 41,300', '97140 33215', true),
      mk('G', 'Ganesh Freight Carriers', '24AAGFG1146N1Z2', 'Surat → Malegaon', '', '₹ 45/box', '3', '96%', '₹ 12,640', '98795 60021', true),
      mk('S', 'Shiv Logistics', '24ACNFS7730H1Z9', 'Surat → Tiruppur', '+1 route', '₹ 7.40/kg', '2', '91%', '₹ 18,900', '90990 44178', true),
      mk('A', 'Ambaji Road Carriers', '24AAMFA5521P1Z3', 'Surat → Erode', '', '₹ 7.10/kg', '2', '88%', '₹ 3,410', '98255 12907', true),
      mk('R', 'Rajdhani Transport Co.', '24AAPFR0048K1Z1', 'Surat → Kolkata', '', '₹ 8.90/kg', '0', '—', '₹ 0', '98240 99112', false)
    ];

      return { ...base, rows: rows.map((r) => ({ ...r, edit: () => {} })), cards: [{ l: 'Active transporters', v: '22' }, { l: 'LRs in transit', v: '31' }, { l: 'Freight due', v: '₹ 1.84 L' }, { l: 'On-time this month', v: '94%' }], count: '8 of 22 transporters', exportCsv: () => {} };
    }
    const inr = (n, d) => { const v = Number(n) || 0; const s = Math.abs(v).toFixed(d || 0); let [i, f] = s.split('.'); let l3 = i.slice(-3), rest = i.slice(0, -3); if (rest) l3 = ',' + l3; rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ','); return (v < 0 ? '-' : '') + rest + l3 + (f ? '.' + f : ''); };
    const RB = { PER_KG: '/kg', PER_BOX: '/box', PER_TRIP: '/trip' };
    const bal = new Map((st.lk ? st.lk.ledgers : []).map((x) => [x.id, x.balance]));
    const ew = st.ew || []; const delivered = ew.filter((b) => b.ewbStatus === 'DELIVERED').length; const done = ew.filter((b) => b.ewbNo).length;
    const vis = st.rows.filter((r) => (!st.fq || r.name.toLowerCase().indexOf(st.fq.toLowerCase()) >= 0) && (!st.fr || String(r.routes || '').toLowerCase().indexOf(st.fr.toLowerCase()) >= 0) && (!st.fb || r.rateBasis === st.fb));
    const rows = vis.map((r) => { const rts = String(r.routes || '').split(/[,;]/).map((x) => x.trim()).filter(Boolean); const due = r.accountId ? -(bal.get(r.accountId) || 0) : 0; const on = r.status === 'ACTIVE';
      return { i: r.name.charAt(0), n: r.name, id: r.transporterId || r.gstin || '—', r1: rts[0] || '—', more: rts.length > 1 ? '+' + (rts.length - 1) + (rts.length > 2 ? ' routes' : ' route') : '', rate: r.rate ? '₹ ' + inr(r.rate, 2) + (RB[r.rateBasis] || '') : '—', lr: String(r.inTransit || 0), ot: r.bills ? r.bills + ' bills' : '—', due: due > 0 ? '₹ ' + inr(due) : '—', ph: r.mobile || '—', s: on ? 'Active' : 'Paused', sc: '--c: ' + (on ? '#22C55E' : '#8F8F8F'), edit: () => this.fmOpen('Edit transporter · ' + r.name, r, r.id) }; });
    const freight = st.rows.reduce((a, r) => a + (r.accountId ? Math.max(0, -(bal.get(r.accountId) || 0)) : 0), 0);
    const csv = () => [['Name', 'Transporter ID', 'GSTIN', 'Routes', 'Rate basis', 'Rate', 'Mobile', 'City', 'Status']].concat(vis.map((r) => [r.name, r.transporterId, r.gstin, r.routes, r.rateBasis, r.rate, r.mobile, r.city, r.status])).map((a) => a.map((v) => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
    return { ...base, rows, cards: [{ l: 'Active transporters', v: String(st.rows.filter((r) => r.status === 'ACTIVE').length) }, { l: 'LRs in transit', v: String(st.rows.reduce((a, r) => a + (r.inTransit || 0), 0)) }, { l: 'Freight due', v: freight >= 1e5 ? '₹ ' + (freight / 1e5).toFixed(2) + ' L' : '₹ ' + inr(freight) }, { l: 'E-way bills filed', v: String(done) + (delivered ? ' · ' + delivered + ' delivered' : '') }],
      count: vis.length + ' of ' + st.rows.length + ' transporters' + (st.toast ? ' · ' + st.toast : ''), exportCsv: () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv()], { type: 'text/csv' })); a.download = 'Transporters.csv'; a.click(); } catch (e) {} } };
  }
}
</script>
</body>
</html>
