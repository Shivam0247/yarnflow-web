<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YarnFlow · Transporters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.dark{--bg:#141414;--sb:#1B1B1B;--s1:#1E1E1E;--s2:#262626;--s3:#2E2E2E;--bd:#262626;--bd2:#383838;--t1:#EDEDED;--t2:#B5B5B5;--t3:#8F8F8F;--ib:#F5F5F5;--it:#171717;color-scheme:dark}
.light{--bg:#FFFFFF;--sb:#F8F8F8;--s1:#F7F7F7;--s2:#F1F1F1;--s3:#E9E9E9;--bd:#ECECEC;--bd2:#DDDDDD;--t1:#171717;--t2:#525252;--t3:#6B6B6B;--ib:#171717;--it:#FFFFFF;color-scheme:light}
.app{display:flex;flex-wrap:wrap;min-height:100vh;background:var(--bg);color:var(--t1)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.sbw{flex:1 1 236px;max-width:100%;background:var(--sb);border-right:1px solid var(--bd)}
.main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bc{display:flex;align-items:center;gap:8px;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap}
.bc .m{color:var(--t3)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:0;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--s2);color:var(--t1)}
.btn:hover{background:var(--s3)}
.btn.pr{background:var(--ib);color:var(--it)}
.btn.gh{background:transparent}.btn.gh:hover{background:var(--s2)}
.inp{height:34px;border-radius:8px;border:1px solid transparent;background:var(--s2);padding:0 10px;font-size:14px;color:var(--t1);min-width:0}
.inp::placeholder{color:var(--t3)}
.fbar{display:flex;align-items:center;gap:8px;padding:14px 20px;flex-wrap:wrap}
.fbar .inp{flex:1 1 130px;max-width:180px}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.dot{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#8F8F8F)}
.lg{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--s2);color:var(--t2)}
.cell{display:flex;align-items:center;gap:10px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--s2);color:var(--t2)}
.tw{overflow-x:auto;padding:0 20px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{background:var(--s1);color:var(--t3);font-weight:400;text-align:left;padding:9px 10px;white-space:nowrap}
thead th:first-child{border-radius:8px 0 0 8px}thead th:last-child{border-radius:0 8px 8px 0}
td{padding:0 10px;height:52px;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody tr:hover td{background:var(--s1)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.cb{width:16px;height:16px;margin:0;accent-color:#8F8F8F;vertical-align:middle}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:16px 20px 0}
.cardx{border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.cardx b{font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.foot{display:flex;align-items:center;gap:10px;padding:14px 20px;margin-top:auto;flex-wrap:wrap}

.aiw{flex:none;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:20}
.fit .aiw{position:relative;height:100%}
@media (max-width:760px){.aiw{display:none}}

/* gen17: one table size across the app */
table{font-size:13.5px;line-height:18px}
thead th{font-size:13px;padding-top:7px;padding-bottom:7px;height:34px}
tbody tr>td{height:36px!important;padding-top:3px;padding-bottom:3px}
tbody td .sub{font-size:11.5px;line-height:14px}
tfoot td{height:38px}
table .tag{height:20px;font-size:11.5px;padding:0 7px}
table .btn.sm{height:26px;padding:0 9px;font-size:12.5px}
table .cin,table .inp{height:28px;font-size:13.5px}

/* gen27: collapsible sidebar */
.sbw{transition:flex-basis .18s ease,width .18s ease}
.sbw:has(.sbc){flex:0 0 64px!important;width:64px!important;max-width:64px!important;min-width:64px!important}
</style>
</helmet>
<div class="app {{theme}}">
<div class="sbw"><dc-import name="Sidebar" theme="{{theme}}" active="trn" hint-size="236px,960px"></dc-import></div>
<div class="main">
<header class="hdr">
<div class="bc"><span class="m">Transporters</span><span class="m">/</span><button class="btn gh" type="button" style="font-size: 17px; font-weight: 400; padding: 0 8px; height: 32px">List<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
<button class="btn" type="button">LR register</button>
<button class="btn pr" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Create</button>
</header>
<div class="cards">
<div class="cardx"><span class="muted">Active transporters</span><b>22</b></div>
<div class="cardx"><span class="muted">LRs in transit</span><b>31</b></div>
<div class="cardx"><span class="muted">Freight due</span><b>₹ 1.84 L</b></div>
<div class="cardx"><span class="muted">On-time this month</span><b>94%</b></div>
</div>
<div class="fbar">
<input class="inp" type="text" placeholder="Name" aria-label="Transporter name">
<input class="inp" type="text" placeholder="Route" aria-label="Route">
<select class="inp" aria-label="Rate basis"><option>Rate basis</option><option>Per kg</option><option>Per box</option><option>Per trip</option></select>
<div style="flex: 1"></div>
<button class="btn" type="button">Filter</button><button class="btn" type="button">Sort</button><button class="btn" type="button">Columns</button>
</div>
<div class="tw"><table>
<thead><tr><th style="width: 36px"><input class="cb" type="checkbox" aria-label="Select all"></th><th>Transporter</th><th>Transporter ID</th><th>Main routes</th><th class="r">Rate</th><th class="r">In transit</th><th class="r">On-time</th><th class="r">Freight due</th><th>Contact</th><th>Status</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="x" hint-placeholder-count="8">
<tr><td><input class="cb" type="checkbox" aria-label="Select transporter"></td><td><span class="cell"><span class="lg">{{x.i}}</span>{{x.n}}</span></td><td class="t2" style="font-variant-numeric: tabular-nums">{{x.id}}</td><td><span class="tag">{{x.r1}}</span> <span class="muted" style="font-size: 13px">{{x.more}}</span></td><td class="r">{{x.rate}}</td><td class="r">{{x.lr}}</td><td class="r">{{x.ot}}</td><td class="r">{{x.due}}</td><td class="t2">{{x.ph}}</td><td><span class="dot" style="{{x.sc}}">{{x.s}}</span></td></tr>
</sc-for>
</tbody></table></div>
<div class="foot"><span class="muted">8 of 22 transporters</span><div style="flex: 1"></div><button class="btn" type="button">Load More</button></div>
</div>
<div class="aiw"><dc-import name="Assistant" theme="{{theme}}" page="trn" hint-size="52px,960px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (i, n, id, r1, more, rate, lr, ot, due, ph, on) => ({ i, n, id, r1, more, rate, lr, ot, due, ph, s: on ? 'Active' : 'Paused', sc: '--c: ' + (on ? '#22C55E' : '#8F8F8F') });
    const rows = [
      mk('N', 'Navkar Roadlines', '24AAJFN3381Q1Z6', 'Surat → Bhiwandi', '+2 routes', '₹ 3.20/kg', '9', '97%', '₹ 48,200', '98984 22410', true),
      mk('J', 'Jay Ambe Roadlines', '24AAKFJ6619L1Z0', 'Silvassa → Surat', '+1 route', '₹ 2.10/kg', '6', '95%', '₹ 31,600', '98252 70014', true),
      mk('S', 'Sai Kripa Transport', '24ABUFS2207C1Z4', 'Surat → Ichalkaranji', '+3 routes', '₹ 3.60/kg', '5', '92%', '₹ 27,950', '99250 18840', true),
      mk('M', 'Mahalaxmi Cargo Movers', '24AAFFM9054R1Z8', 'Surat → Ludhiana', '+1 route', '₹ 6.80/kg', '4', '89%', '₹ 41,300', '97140 33215', true),
      mk('G', 'Ganesh Freight Carriers', '24AAGFG1146N1Z2', 'Surat → Malegaon', '', '₹ 45/box', '3', '96%', '₹ 12,640', '98795 60021', true),
      mk('S', 'Shiv Logistics', '24ACNFS7730H1Z9', 'Surat → Tiruppur', '+1 route', '₹ 7.40/kg', '2', '91%', '₹ 18,900', '90990 44178', true),
      mk('A', 'Ambaji Road Carriers', '24AAMFA5521P1Z3', 'Surat → Erode', '', '₹ 7.10/kg', '2', '88%', '₹ 3,410', '98255 12907', true),
      mk('R', 'Rajdhani Transport Co.', '24AAPFR0048K1Z1', 'Surat → Kolkata', '', '₹ 8.90/kg', '0', '—', '₹ 0', '98240 99112', false)
    ];
    return { theme: this.props.theme ?? 'dark', rows };
  }
}
</script>
</body>
</html>
