<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.dark{--bg:#141414;--sb:#1B1B1B;--s1:#1E1E1E;--s2:#262626;--s3:#2E2E2E;--bd:#262626;--bd2:#383838;--t1:#EDEDED;--t2:#B5B5B5;--t3:#8F8F8F;--ib:#F5F5F5;--it:#171717;--pop:#1E1E1E;color-scheme:dark}
.light{--bg:#FFFFFF;--sb:#F8F8F8;--s1:#F7F7F7;--s2:#F1F1F1;--s3:#E9E9E9;--bd:#ECECEC;--bd2:#DDDDDD;--t1:#171717;--t2:#525252;--t3:#6B6B6B;--ib:#171717;--it:#FFFFFF;--pop:#FFFFFF;color-scheme:light}
.app{display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--t1)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.sbw{flex:0 0 236px;height:100%;overflow-y:auto;background:var(--sb);border-right:1px solid var(--bd)}
.main{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.main>*{flex:none}
.hdr{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bc{display:flex;align-items:center;gap:8px;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap}
.bc .m{color:var(--t3)}
.bc a.m{cursor:pointer;border-radius:6px;padding:3px 6px;margin:0 -2px 0 -6px}
.bc a.m:hover{color:var(--t1);background:var(--s2);text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:0;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--s2);color:var(--t1)}
.btn:hover{background:var(--s3)}
.btn.pr{background:var(--ib);color:var(--it)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.gh{background:transparent}.btn.gh:hover{background:var(--s2)}
.btn.no{background:rgba(239,68,68,.14);color:#F87171}
.btn.ok{background:#16A34A;color:#fff}
.inp{height:32px;border-radius:8px;border:1px solid transparent;background:var(--s2);padding:0 10px;font-size:14px;color:var(--t1);min-width:0}
.inp::placeholder{color:var(--t3)}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--s2);color:var(--t2)}
.t-green{background:rgba(34,197,94,.14);color:#4ADE80}.t-orange{background:rgba(249,115,22,.15);color:#FB923C}.t-red{background:rgba(239,68,68,.15);color:#F87171}.t-blue{background:rgba(59,130,246,.16);color:#60A5FA}.t-gray{background:var(--s2);color:var(--t2)}.t-purple{background:rgba(168,85,247,.16);color:#C084FC}
.light .t-green{color:#15803D}.light .t-orange{color:#C2410C}.light .t-red{color:#B91C1C}.light .t-blue{color:#1D4ED8}.light .t-purple{color:#7E22CE}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:9px 10px;color:var(--t3);border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--t1);border-bottom-color:var(--t1)}
.tab .n{font-size:12px;background:var(--s2);border-radius:6px;padding:0 6px;color:var(--t2);font-variant-numeric:tabular-nums}
.dot{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#8F8F8F)}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 20px;flex-wrap:wrap}
.bulk{display:flex;align-items:center;gap:8px;padding:6px 20px;background:rgba(59,130,246,.10);border-top:1px solid rgba(59,130,246,.25);border-bottom:1px solid rgba(59,130,246,.25);flex-wrap:wrap;font-size:13.5px}
.okbar{display:flex;align-items:center;gap:10px;margin:0 20px 8px;padding:8px 12px;border-radius:8px;background:rgba(34,197,94,.12);color:#4ADE80;font-size:13.5px}
.light .okbar{color:#15803D}
.okbar button{margin-left:auto;border:0;background:transparent;color:inherit;cursor:pointer}
.reg{flex:1 1 auto!important;min-height:0;overflow:auto;margin:0 20px 12px;border:1px solid var(--bd);border-radius:10px}
table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.reg>table.cft{min-height:100%}
thead th{background:var(--s1);color:var(--t3);font-weight:400;text-align:left;padding:0 9px;white-space:nowrap;border-bottom:1px solid var(--bd)}
td{padding:0 9px;border-bottom:1px solid var(--bd);white-space:nowrap}
.r{text-align:right;font-variant-numeric:tabular-nums}
.cbx{width:15px;height:15px;margin:0;accent-color:#3B82F6;vertical-align:middle;cursor:pointer}
.reg tbody tr:nth-child(even)>td{background:rgba(255,255,255,.04)}
.light .reg tbody tr:nth-child(even)>td{background:#F6F7F9}
.reg tbody tr:hover>td{background:var(--s2)}
.reg tbody tr.sel>td{background:rgba(59,130,246,.22)!important}
.light .reg tbody tr.sel>td{background:#DBEAFE!important}
.reg tbody tr.sel>td:first-child{box-shadow:inset 3px 0 0 #3B82F6}
.cft tbody tr:not(.fillr):not(.more){cursor:pointer;user-select:none}
.cft tbody tr.fillr>td{height:auto!important;padding:0!important;border:0!important;background:transparent!important}
.cft tbody tr.more>td{height:40px!important;text-align:center;color:var(--t3);font-size:13px;background:transparent!important}
.cft tfoot td{position:sticky;bottom:0;z-index:4;background:var(--s2);font-weight:600;border-top:1px solid var(--bd2);border-bottom:0;white-space:nowrap}
.cft td.lnk{color:var(--t1);font-weight:500;text-decoration:underline;text-decoration-color:var(--bd2);text-underline-offset:3px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd2);border-top-color:#3B82F6;border-radius:50%;animation:sp .8s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.aiw{flex:none;height:100vh}
@media (max-width:760px){.aiw{display:none}.sbw{display:none}}

/* gen17: one table size across the app */
table{font-size:13.5px;line-height:18px}
thead th{font-size:13px;padding-top:7px;padding-bottom:7px;height:34px}
tbody tr>td{height:36px!important;padding-top:3px;padding-bottom:3px}
tbody td .sub{font-size:11.5px;line-height:14px}
tfoot td{height:38px}
table .tag{height:20px;font-size:11.5px;padding:0 7px}
table .btn.sm{height:26px;padding:0 9px;font-size:12.5px}
table .cin,table .inp{height:28px;font-size:13.5px}

.ent{flex:1 1 auto!important;min-height:0;display:flex;flex-direction:column;overflow:auto}
.ent>*{flex:none}
.sec{padding:10px 20px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sh h2{margin:0;font-size:15px;font-weight:600;white-space:nowrap}
.props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.pg{display:flex;flex-direction:column;padding:4px 0 6px;min-width:0}
.pg+.pg{border-left:1px solid var(--bd)}
.pgt{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);padding:5px 14px 1px}
.pr{display:grid;grid-template-columns:112px minmax(0,1fr) auto;align-items:center;gap:6px;padding:0 10px 0 14px;min-height:28px}
.pr:hover{background:var(--s1)}
.pr label{font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{height:26px;border:1px solid transparent;border-radius:7px;background:transparent;padding:0 8px;font-size:13.5px;color:var(--t1);width:100%;min-width:0}
.pv:hover{background:var(--s2)}.pv:focus{outline:0;border-color:#3B82F6;background:var(--bg)}
.pv[readonly]{color:var(--t2)}.pv[readonly]:hover{background:transparent}
.pv::placeholder{color:var(--t3)}
select.pv{cursor:pointer}
.pr .unit{font-size:12px;color:var(--t3);white-space:nowrap}
.sec.items{flex:1 1 auto!important;min-height:250px}
.tw{flex:1 1 auto;min-height:0;overflow:auto;border:1px solid var(--bd);border-radius:10px}
.it thead th{position:sticky;top:0;z-index:2}
.it tbody td{height:36px}
.it tfoot td{position:sticky;bottom:0;background:var(--s2);font-weight:600;height:38px;border-top:1px solid var(--bd2);border-bottom:0;white-space:nowrap}
.it td.n{color:var(--t3);width:34px}
.it td.nm{font-weight:500}
.cin{height:28px;border:1px solid var(--bd2);border-radius:6px;background:transparent;padding:0 7px;font-size:13.5px;color:var(--t1);width:100%;min-width:64px}
.cin:focus{outline:0;border-color:#3B82F6}
.cin::placeholder{color:var(--t3)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.box{border:1px solid var(--bd);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.box h3{margin:0 0 3px;font-size:13px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:20px;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kv span:last-child{white-space:nowrap}
.kv.big{border-top:1px dashed var(--bd2);padding-top:6px;margin-top:3px}.kv.big span:first-child{color:var(--t1);font-weight:600}.kv.big span:last-child{font-size:18px;font-weight:600}
.flg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.fl{display:flex;flex-direction:column;gap:1px;min-width:0}
.fl label{font-size:12.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .inp{height:28px;font-size:13px;width:100%;padding:0 8px}
.fl label{font-size:11.5px}
.actbar{display:flex;align-items:center;gap:6px;padding:10px 20px;border-top:1px solid var(--bd);flex-wrap:wrap}
.actbar .btn{height:32px}
.actbar select.inp{width:110px;height:32px}
@media (max-width:1180px){.props,.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}.pg:nth-child(3){grid-column:1 / -1;border-left:0;border-top:1px solid var(--bd)}}

/* gen19: breadcrumb parent is a clear link back */
.bc a.m{cursor:pointer;text-decoration:none;border-radius:6px;padding:3px 6px;margin:0 -2px 0 -6px;transition:background .12s,color .12s}
.bc a.m:hover{color:var(--t1);background:var(--s2);text-decoration:underline;text-underline-offset:3px}

/* gen27: collapsible sidebar */
.sbw{transition:flex-basis .18s ease,width .18s ease}
.sbw:has(.sbc){flex:0 0 64px!important;width:64px!important;max-width:64px!important;min-width:64px!important}
</style>
</helmet>
<div class="app {{theme}}">
<div class="sbw"><dc-import name="Sidebar" theme="{{theme}}" active="{{kind}}" hint-size="236px,1000px"></dc-import></div>
<div class="main">
<header class="hdr">
<div class="bc"><a class="m" href="{{listHref}}">{{crumb}}</a><span class="m">/</span><span>{{title}}</span><span class="{{tagC}}">{{tagL}}</span></div>

<sc-for list="{{hbtn}}" as="b" hint-placeholder-count="2"><button class="btn" type="button">{{b}}</button></sc-for>
<button class="btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>Upload</button>
</header>
<div class="ent">
<section class="sec">
<div class="sh"><h2>{{detailsT}}</h2></div>
<div class="props"><sc-for list="{{groups}}" as="g" hint-placeholder-count="3"><div class="pg"><div class="pgt">{{g.t}}</div><sc-for list="{{g.rows}}" as="f" hint-placeholder-count="5"><div class="pr"><label>{{f.l}}</label><sc-if value="{{f.isSel}}" hint-placeholder-val="{{false}}"><select class="pv" aria-label="{{f.l}}"><option>{{f.v}}</option><option>{{f.alt}}</option></select></sc-if><sc-if value="{{f.isIn}}" hint-placeholder-val="{{true}}"><input class="pv" type="text" value="{{f.v}}" placeholder="{{f.ph}}" aria-label="{{f.l}}"></sc-if><sc-if value="{{f.isRo}}" hint-placeholder-val="{{false}}"><input class="pv" type="text" value="{{f.v}}" readonly aria-label="{{f.l}}"></sc-if><span class="unit">{{f.u}}</span></div></sc-for></div></sc-for></div>
</section>
<section class="sec items">
<div class="sh"><h2>Items</h2></div>
<div class="tw"><table class="it">
<thead><tr><th>#</th><sc-for list="{{cols}}" as="c" hint-placeholder-count="12"><th class="{{c.cls}}">{{c.l}}</th></sc-for></tr></thead>
<tbody>
<sc-for list="{{lines}}" as="r" hint-placeholder-count="2"><tr><td class="n">{{r.n}}</td><sc-for list="{{r.cells}}" as="x" hint-placeholder-count="12"><td class="{{x.cls}}">{{x.v}}</td></sc-for></tr></sc-for>
<tr><td class="n">{{nextN}}</td><sc-for list="{{cols}}" as="c" hint-placeholder-count="12"><td><input class="cin" type="text" aria-label="{{c.l}}" placeholder="{{c.ph}}" value="{{c.dv}}" style="{{c.w}}"></td></sc-for></tr>
</tbody>
<tfoot><tr><td></td><sc-for list="{{foot}}" as="x" hint-placeholder-count="12"><td class="{{x.cls}}">{{x.v}}</td></sc-for></tr></tfoot>
</table></div>
</section>
<section class="sec">
<div class="cols3"><sc-for list="{{boxes}}" as="b" hint-placeholder-count="3"><div class="box"><h3>{{b.t}}</h3><sc-for list="{{b.kv}}" as="k" hint-placeholder-count="5"><div class="{{k.c}}"><span>{{k.a}}</span><span>{{k.b}}</span></div></sc-for><div class="flg" style="{{b.gs}}"><sc-for list="{{b.fl}}" as="k" hint-placeholder-count="4"><div class="fl"><label>{{k.a}}</label><input class="inp" type="text" value="{{k.b}}" placeholder="{{k.ph}}" aria-label="{{k.a}}"></div></sc-for></div></div></sc-for></div>
</section>
</div>
<div class="actbar">
<select class="inp" aria-label="More actions"><option>More…</option><option>Party details</option><option>Adjustment details</option></select>
<button class="btn no" type="button">Delete</button>
<div style="flex: 1"></div>
<span class="muted" style="font-size: 13px">{{note}}</span>
<a class="btn gh" href="{{listHref}}">{{closeL}}</a>
<button class="btn" type="button">{{printL}}</button>
<button class="btn pr" type="button" onClick="{{save}}">{{saveL}}</button>
</div>
</div>
<div class="aiw"><dc-import name="Assistant" theme="{{theme}}" page="{{aiPage}}" hint-size="52px,960px"></dc-import></div>
</div>

// shared config for the five voucher types (embedded into VoucherEntry + VoucherList)
const KINDS = {

const TITLE = (s) => String(s).toLowerCase().replace(/(^|[\s(.\-/&])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Llp|Pvt|Ltd|P)\b/g, (w) => w.toUpperCase()).replace(/\bLtd\b/gi, 'Ltd');

const rnd = (seed) => { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; };
const z2 = (n) => String(n).padStart(2, '0');

function makeRows(kind) {

      theme, kind, listHref: K.list + sfx + '.dc.html', aiPage: { ds: 'so', gs: 'disp', sr: 'disp', gp: 'pb', pr: 'pb' }[kind],
      crumb: view ? K.reg : K.mod + ' \u00b7 ' + K.title, title: view ? REC.no : 'New ' + K.title.charAt(0).toLowerCase() + K.title.slice(1),
      tagL: view ? (REC.st || REC.sign || 'Saved') : 'New', tagC: 'tag' + (view ? ' t-blue' : ''),
      hbtn: HB, detailsT: { ds: 'Schedule details', gs: 'Bill details', gp: 'Bill details', sr: 'Return details', pr: 'Return details' }[kind],
      groups, cols: cols.map((c, i) => ({ l: c.l, cls: c.r ? 'r' : '', ph: i === 0 ? (kind === 'ds' ? 'Search item' : 'Code') : (i === 1 && kind !== 'ds' ? 'Search item' : ''), dv: c.k === 'unit' ? (kind === 'gs' ? 'Nos' : 'Kg') : '', w: c.w ? 'width: ' + c.w + 'px' : (c.r ? 'width: 84px' : 'width: 96px') })),
      lines, nextN: String(L.length + 1), foot: L.length ? foot : cols.map((c2, i) => ({ cls: c2.r ? 'r' : '', v: i === 0 ? 'Total' : (c2.t ? inr(0, c2.d) : '') })), boxes,
      closeL: view ? 'Close' : 'Cancel', printL: view ? 'Print' : 'Save & print', saveL: view ? (saved ? '\u2713 Updated' : 'Update') : (saved ? '\u2713 Saved' : 'Save'),
      note: view ? (saved ? 'Changes saved to ' + REC.no : 'Editing ' + REC.no) : (saved ? 'Saved as ' + K.no : ''), save: () => this.setState({ saved: true })
    };
  }
}
