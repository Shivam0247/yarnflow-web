<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YarnFlow · Accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.dark{--bg:#141414;--sb:#1B1B1B;--s1:#1E1E1E;--s2:#262626;--s3:#2E2E2E;--bd:#262626;--bd2:#383838;--t1:#EDEDED;--t2:#B5B5B5;--t3:#8F8F8F;--ib:#F5F5F5;--it:#171717;--pop:#1E1E1E;color-scheme:dark}
.light{--bg:#FFFFFF;--sb:#F8F8F8;--s1:#F7F7F7;--s2:#F1F1F1;--s3:#E9E9E9;--bd:#ECECEC;--bd2:#DDDDDD;--t1:#171717;--t2:#525252;--t3:#6B6B6B;--ib:#171717;--it:#FFFFFF;--pop:#FFFFFF;color-scheme:light}
.app{display:flex;flex-wrap:wrap;min-height:100vh;background:var(--bg);color:var(--t1);position:relative}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.sbw{flex:1 1 236px;max-width:100%;background:var(--sb);border-right:1px solid var(--bd)}
.main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bc{display:flex;align-items:center;gap:8px;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap}
.bc .m{color:var(--t3)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:0;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--s2);color:var(--t1)}
.btn:hover{background:var(--s3)}
.btn.pr{background:var(--ib);color:var(--it)}
.btn.gh{background:transparent}.btn.gh:hover{background:var(--s2)}
.btn.ic{width:34px;padding:0;justify-content:center}
.inp{height:34px;border-radius:8px;border:1px solid transparent;background:var(--s2);padding:0 10px;font-size:14px;color:var(--t1);min-width:0}
.inp::placeholder{color:var(--t3)}
.fbar{display:flex;align-items:center;gap:8px;padding:14px 20px;flex-wrap:wrap}
.fbar .inp{flex:1 1 130px;max-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:14px 20px 0}
.chip{height:30px;padding:0 12px;border-radius:8px;border:0;background:var(--s1);color:var(--t3);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--s3);color:var(--t1)}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.dot{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#8F8F8F)}
.lg{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--s2);color:var(--t2)}
.cell{display:flex;align-items:center;gap:10px}
.tw{overflow-x:auto;padding:0 20px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{background:var(--s1);color:var(--t3);font-weight:400;text-align:left;padding:9px 10px;white-space:nowrap}
thead th:first-child{border-radius:8px 0 0 8px}thead th:last-child{border-radius:0 8px 8px 0}
td{padding:0 10px;height:46px;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody tr:hover td{background:var(--s1)}
.r{text-align:right;font-variant-numeric:tabular-nums}
.cb{width:16px;height:16px;margin:0;accent-color:#8F8F8F;vertical-align:middle}
.foot{display:flex;align-items:center;gap:10px;padding:14px 20px;margin-top:auto;flex-wrap:wrap}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:72px 16px;z-index:10}
.light .scrim{background:rgba(0,0,0,.25)}
.modal{width:min(720px,100%);background:var(--pop);border:1px solid var(--bd2);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.45);display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.mh h2{margin:0;font-size:19px;font-weight:600;flex:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 16px;padding:14px 20px}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}.fld label{color:var(--t3)}.fld .inp{width:100%}
.sub{padding:8px 20px 0;font-weight:600}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--bd);margin-top:8px}
.sw{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--s3);position:relative;cursor:pointer;margin:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:#22C55E}.sw:checked::after{left:16px}

.aiw{flex:none;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:20}
.fit .aiw{position:relative;height:100%}
@media (max-width:760px){.aiw{display:none}}

/* gen17: one table size across the app */
table{font-size:13.5px;line-height:18px}
thead th{font-size:13px;padding-top:7px;padding-bottom:7px;height:34px}
tbody tr>td{height:36px!important;padding-top:3px;padding-bottom:3px}
tbody td .sub{font-size:11.5px;line-height:14px}
tfoot td{height:38px}
table .tag{height:20px;font-size:11.5px;padding:0 7px}
table .btn.sm{height:26px;padding:0 9px;font-size:12.5px}
table .cin,table .inp{height:28px;font-size:13.5px}

/* gen27: collapsible sidebar */
.sbw{transition:flex-basis .18s ease,width .18s ease}
.sbw:has(.sbc){flex:0 0 64px!important;width:64px!important;max-width:64px!important;min-width:64px!important}
.scrim.fmx{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:56px 16px;z-index:30}
.fmx .modal{width:min(860px,100%);background:var(--pop,var(--bg));border:1px solid var(--bd2);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.45);display:flex;flex-direction:column;max-height:calc(100vh - 112px)}
.fmx .mh{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.fmx .mh h2{margin:0;font-size:19px;font-weight:600;flex:1}
.fmx .fmb{overflow:auto;padding-bottom:6px}
.fmx .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px;padding:10px 20px}
.fmx .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fmx .fld>label{color:var(--t3);font-size:13px}
.fmx .fld .inp{width:100%;max-width:none;height:34px}
.fmx .sub{padding:12px 20px 0;font-weight:600;font-size:13px}
.fmx .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bd)}
.fmx .sw{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--s3);position:relative;cursor:pointer;margin:0;flex:none}
.fmx .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.fmx .sw:checked{background:#22C55E}
.fmx .sw:checked::after{left:16px}
</style>
</helmet>
<div class="app {{theme}}">
<div class="sbw"><dc-import name="Sidebar" theme="{{theme}}" active="acc" hint-size="236px,960px"></dc-import></div>
<div class="main">
<header class="hdr">
<div class="bc"><span class="m">Accounts</span><span class="m">/</span><button class="btn gh" type="button" onClick="{{exportCsv}}" style="font-size: 17px; font-weight: 400; padding: 0 8px; height: 32px">List<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
<button class="btn" type="button" onClick="{{importCsv}}">Import from Excel / Tally</button>
<button class="btn pr" type="button" onClick="{{open}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Create</button>
</header>
<div class="chips" role="group" aria-label="Account type">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="7"><button class="{{c.cls}}" type="button" onClick="{{c.pick}}">{{c.n}} <span>{{c.k}}</span></button></sc-for>
</div>
<div class="fbar">
<input class="inp" type="text" placeholder="Account name" aria-label="Account name" value="{{fq}}" onChange="{{setFq}}">
<input class="inp" type="text" placeholder="GSTIN" aria-label="GSTIN" value="{{fg}}" onChange="{{setFg}}">
<input class="inp" type="text" placeholder="City" aria-label="City" value="{{fc}}" onChange="{{setFc}}">
<select class="inp" aria-label="Group" value="{{fgr}}" onChange="{{setFgr}}"><option value="">Group</option><sc-for list="{{groups}}" as="o" hint-placeholder-count="2"><option>{{o}}</option></sc-for></select>
<div style="flex: 1"></div>
<select class="inp" aria-label="Sort" value="{{sk}}" onChange="{{setSk}}"><option value="">Sort: name</option><option value="bal">Sort: balance</option><option value="city">Sort: city</option></select><button class="btn" type="button" onClick="{{exportCsv}}">Excel</button>
</div>
<div class="tw"><table>
<thead><tr><th style="width: 36px"><input class="cb" type="checkbox" aria-label="Select all"></th><th>Account</th><th>Group</th><th>City</th><th>GSTIN</th><th>Mobile</th><th class="r">Credit limit</th><th class="r">Balance</th><th>Status</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="x" hint-placeholder-count="11">
<tr onDoubleClick="{{x.edit}}"><td><input class="cb" type="checkbox" aria-label="Select account"></td><td><a class="cell" href="Ledger.dc.html" onClick="{{x.led}}"><span class="lg">{{x.i}}</span>{{x.n}}</a></td><td class="t2">{{x.g}}</td><td class="t2">{{x.c}}</td><td class="t2" style="font-variant-numeric: tabular-nums">{{x.gst}}</td><td class="t2">{{x.m}}</td><td class="r">{{x.cl}}</td><td class="r">{{x.b}}</td><td><span class="dot" style="{{x.sc}}">{{x.s}}</span> <button class="btn sm gh" type="button" onClick="{{x.edit}}">Edit</button></td></tr>
</sc-for>
</tbody></table></div>
<div class="foot"><span class="muted">{{count}}</span><div style="flex: 1"></div><sc-if value="{{more}}" hint-placeholder-val="{{true}}"><button class="btn" type="button" onClick="{{loadMore}}">Load More</button></sc-if></div>
</div>


<sc-if value="{{fm.open}}" hint-placeholder-val="{{false}}">
<div class="scrim fmx">
<div class="modal" role="dialog" aria-label="{{fm.title}}">
<div class="mh"><h2>{{fm.title}}</h2><button class="btn gh ic" type="button" aria-label="Close" onClick="{{fm.close}}">✕</button></div>
<div class="fmb">
<sc-for list="{{fm.secs}}" as="sec" hint-placeholder-count="3"><div class="sub">{{sec.t}}</div><div class="fgrid"><sc-for list="{{sec.f}}" as="f" hint-placeholder-count="6"><div class="fld"><label>{{f.l}}<span style="color: #EF4444">{{f.req}}</span></label>
<sc-if value="{{f.isSel}}" hint-placeholder-val="{{false}}"><select class="inp" aria-label="{{f.l}}" value="{{f.v}}" onChange="{{f.on}}"><sc-for list="{{f.opts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.l}}</option></sc-for></select></sc-if>
<sc-if value="{{f.isIn}}" hint-placeholder-val="{{true}}"><input class="inp" type="text" aria-label="{{f.l}}" value="{{f.v}}" placeholder="{{f.ph}}" onChange="{{f.on}}"></sc-if>
<sc-if value="{{f.isChk}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 10px; min-height: 34px"><input class="sw" type="checkbox" aria-label="{{f.l}}" checked="{{f.c}}" onChange="{{f.on}}"><span class="t2">{{f.ph}}</span></span></sc-if>
</div></sc-for></div></sc-for>
</div>
<div class="mf"><span class="{{fm.nc}}" style="flex: 1; align-self: center; font-size: 13px">{{fm.note}}</span><sc-if value="{{fm.canDel}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" style="color: #F87171" onClick="{{fm.del}}">Delete</button></sc-if><button class="btn" type="button" onClick="{{fm.close}}">Cancel</button><button class="btn pr" type="button" onClick="{{fm.save}}" disabled="{{fm.busy}}">{{fm.saveL}}</button></div>
</div>
</div>
</sc-if>
<div class="aiw"><dc-import name="Assistant" theme="{{theme}}" page="acc" hint-size="52px,960px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"showModal":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { type: 'All', modal: null, fq: '', fg: '', fc: '', fgr: '', sk: '', lim: 50, fm: null }; }
  api() { return typeof window !== 'undefined' && window.YF_API && window.YF_API.session ? window.YF_API : null; }
  /* ---- generic master form (spec → sections of fields) ---- */
  fmOpen(title, vals, id) { this.setState({ fm: { title, v: { ...vals }, id: id || null, note: '', err: false, busy: false } }); }
  fmVals(spec, fm) {
    const secs = spec.map((sec) => ({ t: sec.t, f: sec.f.map((x) => { const v = fm.v[x.k]; const on = (e) => this.setState({ fm: { ...this.state.fm, v: { ...this.state.fm.v, [x.k]: x.type === 'chk' ? e.target.checked : e.target.value }, note: '', err: false } });
      return { l: x.l, req: x.req ? ' *' : '', isSel: x.type === 'sel', isIn: !x.type || x.type === 'text', isChk: x.type === 'chk', v: v === null || v === undefined ? '' : String(v), c: !!v, ph: x.ph || '', opts: (x.opts || []).map((o) => ({ v: String(o[0]), l: o[1] })), on }; }) }));
    return { open: true, title: fm.title, secs, note: fm.note, nc: fm.err ? 'tag t-red' : 'muted', busy: !!fm.busy, canDel: !!fm.id, saveL: fm.busy ? 'Saving…' : fm.id ? 'Save changes' : 'Create', close: () => this.setState({ fm: null }) };
  }
  async fmSave(slug, body, done) {
    const api = this.api(); const fm = this.state.fm; if (!api) { this.setState({ fm: null }); return; }
    this.setState({ fm: { ...fm, busy: true, note: 'Saving…', err: false } });
    try { const r = fm.id ? await api.put('/masters/' + slug + '/' + fm.id, body) : await api.post('/masters/' + slug, body); api.invalidate(); this.setState({ fm: null, toast: '✓ Saved ' + (r.name || r.code || '') }); if (done) await done(r); }
    catch (e) { this.setState({ fm: { ...this.state.fm, busy: false, note: api.message(e), err: true } }); }
  }
  async fmDel(slug, done) {
    const api = this.api(); const fm = this.state.fm; if (!api || !fm.id) return;
    if (!window.confirm('Delete this record? It cannot be undone.')) return;
    try { await api.del('/masters/' + slug + '/' + fm.id); api.invalidate(); this.setState({ fm: null, toast: '✓ Deleted' }); if (done) await done(); }
    catch (e) { this.setState({ fm: { ...this.state.fm, note: api.message(e), err: true } }); }
  }
  num(v) { const n = Number(String(v ?? '').replace(/[₹,\s]/g, '')); return isNaN(n) ? 0 : n; }
  nz(v) { return v === '' || v === undefined ? null : v; }
  componentDidMount() { this.load(); }
  async load() {
    const api = this.api(); if (!api) return;
    try { const [a, g, lk] = await Promise.all([api.get('/masters/accounts', { pageSize: 2000 }), api.get('/masters/groups'), api.lookups()]); this.setState({ rows: a.data, grps: g.data, lk });
      let ed = null; try { ed = JSON.parse(window.localStorage.getItem('yf-edit-acc') || 'null'); if (ed) window.localStorage.removeItem('yf-edit-acc'); } catch (e) {}
      if (ed && ed.id) { const r = a.data.find((x) => x.id === ed.id); if (r) this.edit(r); } } catch (e) { this.setState({ toast: api.message(e) }); }
  }
  blank() { const g = (this.state.grps || []).find((x) => /debtor/i.test(x.name)); return { kind: 'CUSTOMER', groupId: g ? g.id : '', gstType: 'REGULAR', state: 'Gujarat', stateCode: '24', creditDays: 30, creditLimit: 0, brokerageType: 'PER_KG', openingType: 'DR', openingBalance: 0, status: 'ACTIVE', interestRate: 18 }; }
  edit(r) { this.fmOpen('Edit account · ' + r.name, r, r.id); }
  spec() {
    const lk = this.state.lk || { brokers: [], transporters: [], salesPersons: [], collectionPersons: [], ledgers: [] };
    const O = (l) => [['', '—']].concat((l || []).map((x) => [x.id, x.name]));
    const KINDS = [['CUSTOMER', 'Customer'], ['SUPPLIER', 'Supplier / mill'], ['BROKER', 'Broker'], ['TRANSPORTER', 'Transporter'], ['BANK', 'Bank'], ['CASH', 'Cash'], ['EXPENSE', 'Expense'], ['INCOME', 'Income'], ['SALES', 'Sales'], ['PURCHASE', 'Purchase'], ['TAX', 'Tax / duty'], ['CAPITAL', 'Capital'], ['LOAN', 'Loan'], ['ASSET', 'Asset'], ['OTHER', 'Other']];
    const ST = [['24', 'Gujarat (24)'], ['27', 'Maharashtra (27)'], ['26', 'Dadra & Nagar Haveli and Daman & Diu (26)'], ['08', 'Rajasthan (08)'], ['33', 'Tamil Nadu (33)'], ['03', 'Punjab (03)'], ['09', 'Uttar Pradesh (09)'], ['07', 'Delhi (07)'], ['29', 'Karnataka (29)'], ['36', 'Telangana (36)'], ['19', 'West Bengal (19)'], ['23', 'Madhya Pradesh (23)'], ['06', 'Haryana (06)'], ['32', 'Kerala (32)'], ['37', 'Andhra Pradesh (37)']];
    return [
      { t: 'Account', f: [{ k: 'name', l: 'Account name', req: 1 }, { k: 'alias', l: 'Alias / short name' }, { k: 'printName', l: 'Print name' }, { k: 'code', l: 'Code' },
        { k: 'groupId', l: 'Under group', req: 1, type: 'sel', opts: [['', 'Choose group']].concat((this.state.grps || []).map((g) => [g.id, (g.parentName ? g.parentName + ' › ' : '') + g.name])) }, { k: 'kind', l: 'Account type', req: 1, type: 'sel', opts: KINDS },
        { k: 'partyGroupId', l: 'Party group (head office)', type: 'sel', opts: O(lk.ledgers.filter((x) => x.kind === 'CUSTOMER' || x.kind === 'SUPPLIER')) }, { k: 'status', l: 'Status', type: 'sel', opts: [['ACTIVE', 'Active'], ['ON_HOLD', 'On hold (orders need approval)'], ['BLOCKED', 'Blocked'], ['INACTIVE', 'Inactive']] }] },
      { t: 'GST & address', f: [{ k: 'gstType', l: 'GST type', type: 'sel', opts: [['REGULAR', 'Regular'], ['COMPOSITION', 'Composition'], ['UNREGISTERED', 'Unregistered'], ['CONSUMER', 'Consumer'], ['SEZ', 'SEZ'], ['EXPORT', 'Export']] }, { k: 'gstin', l: 'GSTIN', ph: '24AAKFS4821R1Z2' }, { k: 'pan', l: 'PAN', ph: 'Taken from GSTIN if blank' },
        { k: 'address1', l: 'Address line 1' }, { k: 'address2', l: 'Address line 2' }, { k: 'area', l: 'Area' }, { k: 'city', l: 'City' }, { k: 'stateCode', l: 'State', type: 'sel', opts: ST }, { k: 'pincode', l: 'Pincode' }] },
      { t: 'Contact', f: [{ k: 'contactPerson', l: 'Contact person' }, { k: 'mobile', l: 'Mobile (WhatsApp)', ph: '98795 33120' }, { k: 'phone', l: 'Phone' }, { k: 'email', l: 'Email' }] },
      { t: 'Credit & terms', f: [{ k: 'creditLimit', l: 'Credit limit ₹' }, { k: 'creditDays', l: 'Credit days' }, { k: 'interestRate', l: 'Interest % p.a. on overdue' }, { k: 'brokerId', l: 'Broker', type: 'sel', opts: O(lk.brokers) }, { k: 'brokerageRate', l: 'Brokerage rate' },
        { k: 'brokerageType', l: 'Brokerage on', type: 'sel', opts: [['PER_KG', '₹ per kg'], ['PERCENT', '% of value']] }, { k: 'transporterId', l: 'Default transporter', type: 'sel', opts: O(lk.transporters) }, { k: 'salesPersonId', l: 'Sales person', type: 'sel', opts: O(lk.salesPersons) },
        { k: 'collectionPersonId', l: 'Collection person', type: 'sel', opts: O(lk.collectionPersons) }] },
      { t: 'TDS / TCS', f: [{ k: 'tdsApplicable', l: 'TDS 194Q', type: 'chk', ph: 'Deduct TDS on purchases' }, { k: 'tdsRate', l: 'TDS %' }, { k: 'tcsApplicable', l: 'TCS 206C(1H)', type: 'chk', ph: 'Collect TCS on sales' }, { k: 'tcsRate', l: 'TCS %' }] },
      { t: 'Bank & opening', f: [{ k: 'bankName', l: 'Bank name' }, { k: 'bankAccountNo', l: 'Account no.' }, { k: 'ifsc', l: 'IFSC' }, { k: 'openingBalance', l: 'Opening balance ₹' }, { k: 'openingType', l: 'Dr / Cr', type: 'sel', opts: [['DR', 'Dr (they owe us)'], ['CR', 'Cr (we owe them)']] }, { k: 'notes', l: 'Notes' }] }
    ];
  }
  body(v) {
    const ST = { 24: 'Gujarat', 27: 'Maharashtra', 26: 'Dadra & Nagar Haveli and Daman & Diu', '08': 'Rajasthan', 33: 'Tamil Nadu', '03': 'Punjab', '09': 'Uttar Pradesh', '07': 'Delhi', 29: 'Karnataka', 36: 'Telangana', 19: 'West Bengal', 23: 'Madhya Pradesh', '06': 'Haryana', 32: 'Kerala', 37: 'Andhra Pradesh' };
    const b = {}; const keys = ['name', 'alias', 'printName', 'code', 'gstin', 'pan', 'address1', 'address2', 'area', 'city', 'stateCode', 'pincode', 'contactPerson', 'mobile', 'phone', 'email', 'bankName', 'bankAccountNo', 'ifsc', 'notes', 'kind', 'status', 'gstType', 'brokerageType', 'openingType'];
    keys.forEach((k) => { b[k] = this.nz(v[k] === null ? '' : String(v[k] ?? '').trim()); });
    ['groupId', 'partyGroupId', 'brokerId', 'transporterId', 'salesPersonId', 'collectionPersonId'].forEach((k) => { b[k] = v[k] ? Number(v[k]) : null; });
